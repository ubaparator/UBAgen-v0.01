name: Validate and deploy UBAgen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system multimedia & transfer dependencies (aria2, ffmpeg, rclone)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aria2 ffmpeg ca-certificates curl unzip
          curl -fsSL https://rclone.org/install.sh | sudo bash
          aria2c --version | head -n 1
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          rclone version | head -n 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python modules
        run: python -B -m compileall -q main.py subtitle_extract.py stats.py health_api.py storage_manager.py job_store.py encoder_worker.py tests

      - name: Run Python regression tests
        run: python -B -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install

      - name: Run Node restart endpoint tests
        run: npx tsx --test tests/node_restart.test.ts

      - name: Type-check frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build production Docker image
        run: |
          docker build --tag ubagen-ci-test .

      - name: Verify encode tools and runtime inside production Docker image
        run: |
          docker run --rm ubagen-ci-test sh -c "\
            echo '=== Container aria2c version ===' && aria2c --version | head -n 2 && \
            echo '=== Container ffmpeg version ===' && ffmpeg -version | head -n 2 && \
            echo '=== Container ffprobe version ===' && ffprobe -version | head -n 2 && \
            echo '=== Container rclone version ===' && rclone version | head -n 2 && \
            rclone help backends | grep -qi 'mega' && \
            rclone help backends | grep -qi 'drive' && \
            python -B -c 'import main, subtitle_extract, stats, health_api, storage_manager, job_store, encoder_worker; print(\"All UBAgen modules loaded successfully in container\")'"

