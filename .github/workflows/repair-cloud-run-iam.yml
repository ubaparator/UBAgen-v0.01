name: Validate no-IAM encoder migration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubagen-encoder-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install multimedia tools for encoder integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg aria2 curl unzip
          curl -fsSL https://rclone.org/install.sh | sudo bash
          aria2c --version | head -n 1
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          rclone version | head -n 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run Python tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Node dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Type-check
        run: npm run lint
      - name: Build and verify production Docker image
        run: |
          docker build --tag ubagen-encoder-test .
          docker run --rm ubagen-encoder-test sh -c "\
            aria2c --version >/dev/null && \
            ffmpeg -version >/dev/null && \
            ffprobe -version >/dev/null && \
            rclone version >/dev/null && \
            rclone help backends | grep -qi 'mega' && \
            rclone help backends | grep -qi 'drive'"
