# ==============================================================================
# UBAgen — Google Cloud Run Job Specification (Dedicated Video Encoder Worker)
# ==============================================================================
# Verified Google Cloud Runtime Configuration:
#   Project ID     : ais-europe-west2-4471ce5b85c94 (Project Number: 444154444547)
#   Region         : europe-west2
#   Service Account: ais-sandbox@ais-europe-west2-4471ce5b85c94.iam.gserviceaccount.com
#   Job Name       : ubagen-encoder-worker
#
# Deploy or update with:
#   gcloud run jobs replace cloud-run-encoder-job.yaml \
#     --project=ais-europe-west2-4471ce5b85c94 \
#     --region=europe-west2
#
# Or run the automated setup & deployment script:
#   bash scripts/deploy_cloud_run_encoder.sh
# ==============================================================================

apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: ubagen-encoder-worker
  namespace: "444154444547"
  labels:
    cloud.googleapis.com/location: europe-west2
    app.kubernetes.io/name: ubagen-encoder-worker
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      parallelism: 1
      taskCount: 1
      template:
        spec:
          # Verified Cloud Run Service Account (least-privilege IAM: roles/datastore.user + roles/storage.objectAdmin)
          serviceAccountName: ais-sandbox@ais-europe-west2-4471ce5b85c94.iam.gserviceaccount.com
          timeoutSeconds: 3600
          maxRetries: 1
          containers:
            - image: europe-west2-docker.pkg.dev/ais-europe-west2-4471ce5b85c94/ubagen-repo/ubagen:latest
              command: ["python3"]
              args: ["-B", "encoder_worker.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: ENVIRONMENT
                  value: "production"
                - name: UBAGEN_GCP_PROJECT_ID
                  value: "ais-europe-west2-4471ce5b85c94"
                - name: UBAGEN_GCP_REGION
                  value: "europe-west2"
                - name: UBAGEN_CLOUD_RUN_JOB_NAME
                  value: "ubagen-encoder-worker"
                - name: UBAGEN_USE_FIRESTORE
                  value: "true"
                - name: UBAGEN_FIRESTORE_DATABASE
                  value: "(default)"
                - name: UBAGEN_FIRESTORE_COLLECTION
                  value: "ubagen_encode_jobs"
                - name: UBAGEN_GCS_BUCKET
                  value: "ais-europe-west2-4471ce5b85c94-ubagen-media"
                - name: UBAGEN_WORKER_TEMP_DIR
                  value: "/tmp/ubagen_worker_scratch"
                - name: UBAGEN_ENCODE_RETENTION_SECONDS
                  value: "7200"
                - name: UBAGEN_PUBLIC_BASE_URL
                  value: "https://ais-pre-cpgku4j2jfxruafwftwvut-444154444547.europe-west2.run.app"
                - name: DISCORD_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: DISCORD_BOT_TOKEN
                      key: latest
              resources:
                limits:
                  # 4 vCPU + 8 GiB RAM for libx264/libx265 encoding and Gen2 in-memory /tmp scratch
                  cpu: "4"
                  memory: "8Gi"
